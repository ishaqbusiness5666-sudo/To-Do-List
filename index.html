<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To DO LIST</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
        integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>

<body>
    <header>
        <div id="logo">Logo</div>
        <h1 id="navIcon"><i class="fa-solid fa-bars"></i></h1>
        <!-- for mobile -->
        <nav id="navLinks" class="filers">
            <button onclick="setFilter('all')" class="filter-btn">All</button>
            <button onclick="setFilter('completed')" class="filter-btn">Completed</button>
            <button onclick="setFilter('pending')" class="filter-btn">Pending</button>
        </nav>
    </header>
    <main>
        <input type="text" id="taskInput" placeholder="Add a task...">
        <button id="addBtn">Add Tasks</button>
        <ul id="taskList"></ul>
    </main>
</body>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.13.0/gsap.min.js"
    integrity="sha512-NcZdtrT77bJr4STcmsGAESr06BYGE8woZdSdEgqnpyqac7sugNO+Tr4bGwGF3MsnEkGKhU2KL2xh6Ec+BqsaHA=="
    crossorigin="anonymous" referrerpolicy="no-referrer"></script>
<script src="gsap.js"></script>
<script src="script.js"></script>

</html>
